<style>

body{margin:0;background:#0e0b1a}
a{color:#f6c79a}a:hover{color:#ffffff}
@keyframes sb-twinkle{0%,100%{opacity:.12}50%{opacity:.85}}
@keyframes sb-drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
@keyframes sb-breathe{0%,100%{opacity:.82}50%{opacity:1}}
@keyframes sb-blink{0%,88%,100%{opacity:.15}92%{opacity:1}}
.sb-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fdf6ee;animation:sb-twinkle 5s ease-in-out infinite}
.sb-cloud{position:absolute;left:0;border-radius:50%;filter:blur(10px);animation:sb-drift 120s linear infinite;will-change:transform}
.sb-glow{animation:sb-breathe 7s ease-in-out infinite}
.sb-win{transition:opacity .9s ease}
@keyframes sb-shine{0%{background-position:100% 0}45%,100%{background-position:0% 0}}
.sb-title{background-image:linear-gradient(105deg,#fdf6ee 40%,#ffd3a0 46%,#ffffff 50%,#ffd3a0 54%,#fdf6ee 60%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(255,190,130,.18));animation:sb-shine 7s cubic-bezier(.45,0,.25,1) 1s infinite}
@keyframes sb-sway{0%,100%{transform:translateX(0) scaleX(1)}50%{transform:translateX(5px) scaleX(.7)}}
@keyframes sb-roll{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
.sb-shim{transform-box:fill-box;transform-origin:center;animation:sb-sway 5s ease-in-out infinite}
.sb-ripple{animation:sb-roll 11s ease-in-out infinite}
.sb-plane{position:absolute;left:0;animation:sb-drift 95s linear infinite}
.sb-light{width:3px;height:3px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 6px #ff6b6b;animation:sb-blink 1.6s linear infinite}
.sb-nav{width:2px;height:2px;border-radius:50%;background:#fff6e8;box-shadow:0 0 4px rgba(255,246,232,.8);opacity:.85}
.sb-craft{display:flex;align-items:center;gap:4px}
.d-stars{position:absolute;inset:0;transform:translate3d(calc(var(--mx,0) * -6px),calc(var(--my,0) * -4px),0)}
.d-sky{position:absolute;inset:0;transform:translate3d(calc(var(--mx,0) * -14px),calc(var(--my,0) * -8px),0)}
.d-sun{transform:translate(calc(var(--mx,0) * -8px),calc(var(--my,0) * -4px))}
.d-far{transform:translate(calc(var(--mx,0) * -12px),calc(var(--my,0) * -3px))}
.d-mid{transform:translate(calc(var(--mx,0) * -24px),calc(var(--my,0) * -5px))}
.d-near{transform:translate(calc(var(--mx,0) * -42px),calc(var(--my,0) * -8px))}
.d-title{transform:perspective(900px) translate3d(calc(var(--mx,0) * 14px),calc(var(--my,0) * 10px),0) rotateY(calc(var(--mx,0) * 9deg)) rotateX(calc(var(--my,0) * -9deg));transform-style:preserve-3d}
.sb-title{filter:drop-shadow(calc(var(--mx,0) * -10px) calc(var(--my,0) * -6px + 14px) 18px rgba(20,8,30,.35)) drop-shadow(0 0 22px rgba(255,190,130,.18))}
.sb-trap{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none}
.sb-title{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@keyframes sb-reveal{from{opacity:0}to{opacity:1}}
@keyframes sb-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sb-secret{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;background:rgba(14,11,26,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:sb-reveal 1.2s ease both}
.sb-card{position:relative;width:100%;max-width:560px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:20px;padding:48px 40px 36px;box-sizing:border-box;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fdf6ee;animation:sb-rise 1.4s .3s ease both}
.sb-close{position:absolute;top:0;right:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:rgba(253,246,238,.7);cursor:pointer;padding:0}
.sb-close:hover{color:#ffffff}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
.sb-secret[hidden]{display:none}
html,body{height:100%}

  };

  var fmt = null;
  function miamiHour() {
    try {
      if (!fmt) fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      var h = 0, m = 0;
      fmt.formatToParts(new Date()).forEach(function (p) { if (p.type === 'hour') h = +p.value; if (p.type === 'minute') m = +p.value; });
      return (h % 24) + m / 60;
    } catch (e) { return 18; }
  }

  function sky(h, fixed) {
    var d = new Date();
    var doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
    var season = Math.cos(2 * Math.PI * (doy - 172) / 365);
    var sr = 6.85 - 0.35 * season, ss = 18.85 + 1.35 * season;
    var K = [[sr - 1.4, 'night'], [sr - 0.6, 'predawn'], [sr + 0.15, 'sunrise'], [sr + 1.6, 'morning'], [12.8, 'day'], [ss - 2.2, 'afternoon'], [ss - 0.7, 'golden'], [ss + 0.05, 'sunset'], [ss + 0.75, 'dusk'], [ss + 1.6, 'night']];
    var a = P.night, b = P.night, t = 0;
    for (var i = 0; i < K.length - 1; i++) {
      if (h >= K[i][0] && h < K[i + 1][0]) { a = P[K[i][1]]; b = P[K[i + 1][1]]; t = (h - K[i][0]) / (K[i + 1][0] - K[i][0]); break; }
    }
    if (fixed) { a = P.sunset; b = P.sunset; t = 0; }
    t = t * t * (3 - 2 * t);
    function hx(s) { return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]; }
    function lc(x, y) { var p = hx(x), q = hx(y); return 'rgb(' + p.map(function (v, i) { return Math.round(v + (q[i] - v) * t); }).join(',') + ')'; }
    function ln(x, y) { return x + (y - x) * t; }
    function cl(x, y) { var v = x.map(function (n, i) { return ln(n, y[i]); }); return 'rgba(' + Math.round(v[0]) + ',' + Math.round(v[1]) + ',' + Math.round(v[2]) + ',' + v[3].toFixed(3) + ')'; }
    var stops = [0, 18, 36, 52, 66, 76, 84, 90];
    var skyC = a.sky.map(function (s, i) { return lc(s, b.sky[i]); });
    var w = a.w.map(function (s, i) { return lc(s, b.w[i]); });
    return {
      sky: 'linear-gradient(180deg, ' + skyC.map(function (s, i) { return s + ' ' + stops[i] + '%'; }).join(', ') + ')',
      w0: w[0], w1: w[1], w2: w[2], w3: w[3],
      far: lc(a.far, b.far), mid: lc(a.mid, b.mid), near: lc(a.near, b.near), haze: lc(a.haze, b.haze), sun: lc(a.sun, b.sun),
      sunDy: (ln(a.sunY, b.sunY) - 262) + 'px', sunOp: ln(a.sunOp, b.sunOp), glow: ln(a.glow, b.glow), star: ln(a.star, b.star), moon: ln(a.moon, b.moon),
      lit: ln(a.lit, b.lit), win: ln(a.win, b.win), refl: ln(a.refl, b.refl), cloudA: cl(a.cA, b.cA), cloudB: cl(a.cB, b.cB)
    };
  }

  // Finestre dei grattacieli
  var B = [[18,250,44],[96,176,38],[140,214,50],[198,140,34],[238,232,56],[300,122,44],[350,196,36],[392,160,48],[446,226,40],[492,88,40],[538,150,46],[590,206,34],[630,170,44],[680,252,30],[760,244,34],[800,186,40],[846,104,46],[898,166,38],[942,66,50],[998,138,40],[1044,198,52],[1102,120,40],[1148,182,48],[1202,146,36],[1244,216,52],[1302,170,40],[1348,234,46],[1400,204,40]];
  var seed = 20261110;

  var wins = [], lit = [], litP = 0.3, winF = 1;
  var NS = 'http://www.w3.org/2000/svg';
  B.forEach(function (b) {

          var el = document.createElementNS(NS, 'rect');

          wins.push({ el: el, on: r < 0.9 ? 0.85 : 0.6 });
          lit.push(rnd() < 0.3);

      }
    }
  });
  function paintWin(i) { wins[i].el.setAttribute('opacity', lit[i] ? wins[i].on * winF : 0); }

  function apply() {
    var c = sky(miamiHour(), !DYNAMIC);
    var s = document.documentElement.style;
    ['sky','w0','w1','w2','w3','far','mid','near','haze','sun','sunDy','sunOp','glow','star','moon','refl','cloudA','cloudB'].forEach(function (k) { s.setProperty('--' + k, c[k]); });

      if (e.pointerType === 'touch') return;

    });

      var now = Date.now();
      var idle = !lastMove || now - lastMove > 4000;
